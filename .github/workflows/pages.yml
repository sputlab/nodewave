name: Website

# Publishes website/ to GitHub Pages (nodewave.org). Settings -> Pages -> Source must be "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["website/**", "app/src/test/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Numbers for the home page
        run: |
          printf '{"since":"%s","releases":%s,"tests":%s}\n' \
            "$(git log --reverse --format=%cs | head -1)" \
            "$(git tag --list 'v*' | wc -l | tr -d ' ')" \
            "$(grep -rh '@Test' app/src/test | wc -l | tr -d ' ')" > website/stats.json
          cat website/stats.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
